<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #2563eb;
      --muted: #6b7280;
      --border: #8884;
      --error: #dc2626;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 3rem 1rem; }
    .app { width: 100%; max-width: 560px; }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    .subtitle { margin: 0 0 1.5rem; color: var(--muted); }

    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 0.6rem 1rem; text-decoration: none; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500;
    }
    .tab:hover { color: inherit; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .panel {
      border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px;
      padding: 1.5rem; display: grid; gap: 1rem;
    }
    label { display: grid; gap: 0.35rem; font-size: 0.875rem; color: var(--muted); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    input, select, button { font: inherit; }
    input, select {
      width: 100%; padding: 0.6rem 0.75rem; border-radius: 8px;
      border: 1px solid var(--border); background: transparent; color: inherit;
    }
    input { font-size: 1.25rem; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      padding: 0.7rem; border: none; border-radius: 8px; background: var(--accent);
      color: #fff; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }

    .result {
      margin: 0; padding: 1rem; border-radius: 8px; background: #2563eb14;
      font-size: 1rem;
    }
    .result strong { display: block; font-size: 1.6rem; margin-top: 0.25rem; word-break: break-all; }
    .error { margin: 0; color: var(--error); }
  </style>
</head>
<body>
  <main class="app">
    <h1>Unit Converter</h1>
    <p class="subtitle">Enter a value, pick the units, and convert.</p>

    <div id="app">
      <nav class="tabs" aria-label="Converter">
        {{range $s := .Sections}}
        <a class="tab{{if eq $s.Key $.Active}} active{{end}}" href="/?tab={{$s.Key}}"
           hx-get="/?tab={{$s.Key}}" hx-target="#app" hx-select="#app" hx-push-url="true"
           {{if eq $s.Key $.Active}}aria-current="page"{{end}}>{{$s.Label}}</a>
        {{end}}
      </nav>

      {{range $s := .Sections}}{{if eq $s.Key $.Active}}
      <section class="panel" aria-label="{{$s.Label}} converter">
        <form method="post" action="/convert/{{$s.Key}}"
              hx-post="/convert/{{$s.Key}}" hx-target="#app" hx-select="#app">
          <label>Value
            <input type="text" name="value" value="{{$s.Value}}" inputmode="decimal" required>
          </label>
          <div class="row">
            <label>From
              <select name="from">
                {{range $u := $s.Units}}<option value="{{$u.Key}}" {{if eq $u.Key $s.From}}selected{{end}}>{{$u.Label}}</option>{{end}}
              </select>
            </label>
            <label>To
              <select name="to">
                {{range $u := $s.Units}}<option value="{{$u.Key}}" {{if eq $u.Key $s.To}}selected{{end}}>{{$u.Label}}</option>{{end}}
              </select>
            </label>
          </div>
          <button type="submit">Convert</button>
        </form>

        {{if $s.Error}}<p class="error" role="alert">{{$s.Error}}</p>{{end}}
        {{if $s.Result}}
        <p class="result">{{$s.Value}} {{$s.FromLabel}} =<strong>{{$s.Result}} {{$s.ToLabel}}</strong></p>
        {{end}}
      </section>
      {{end}}{{end}}
    </div>
  </main>
</body>
</html>
